<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Погода Львів — Kindle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      width: 580px;
      margin: 0 auto;
      padding: 10px 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    .header {
      border-bottom: 3px solid #000000;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .city {
      font-size: 26px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .updated {
      font-size: 16px;
      text-align: right;
      vertical-align: bottom;
    }
    .current-box {
      border: 3px solid #000000;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .temp-now {
      font-size: 64px;
      font-weight: bold;
      line-height: 1;
      width: 34%;
      vertical-align: middle;
    }
    .details-now {
      vertical-align: middle;
      width: 66%;
    }
    .cond-now {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub-details td {
      font-size: 17px;
      line-height: 1.35;
      vertical-align: top;
      width: 50%;
    }
    .section-title {
      font-size: 17px;
      font-weight: bold;
      text-transform: uppercase;
      background-color: #000000;
      color: #ffffff;
      padding: 5px 10px;
      margin-bottom: 6px;
    }
    .hourly-table {
      margin-bottom: 10px;
      border: 2px solid #000000;
    }
    .hourly-table td {
      width: 25%;
      text-align: center;
      padding: 6px 4px;
      border-right: 2px solid #000000;
    }
    .hourly-table td:last-child {
      border-right: none;
    }
    .h-time {
      font-size: 17px;
      font-weight: bold;
    }
    .h-temp {
      font-size: 25px;
      font-weight: bold;
      margin: 2px 0;
    }
    .h-desc {
      font-size: 14px;
    }
    .daily-table td {
      padding: 10px 3px;
      border-bottom: 2px solid #000000;
      font-size: 19px;
      cursor: pointer;
    }
    .daily-table tr:last-child td {
      border-bottom: none;
    }
    .d-day {
      font-weight: bold;
      width: 31%;
      text-align: left;
    }
    .d-desc {
      width: 20%;
      font-size: 16px;
      text-align: left;
    }
    .d-pop {
      width: 13%;
      font-size: 15px;
      text-align: left;
      white-space: nowrap;
    }
    .d-hum {
      width: 12%;
      font-size: 15px;
      text-align: left;
      white-space: nowrap;
    }
    .d-temp {
      text-align: right;
      font-weight: bold;
      width: 24%;
      white-space: nowrap;
    }
    .icon-svg {
      width: 14px;
      height: 14px;
      vertical-align: -2px;
      margin-right: 2px;
    }
    .arrow-hint {
      font-weight: normal;
      font-size: 18px;
      padding-left: 3px;
    }
    .back-btn {
      display: inline-block;
      background-color: #000000;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 8px 16px;
      text-decoration: none;
      border: 2px solid #000000;
    }
    .error-msg {
      font-size: 20px;
      font-weight: bold;
      padding: 20px;
      border: 2px solid #000000;
      text-align: center;
    }
    .stale-note {
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #000000;
      padding: 4px 8px;
      margin-bottom: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="app">
    <table class="header">
      <tr>
        <td class="city">Львів</td>
        <td class="updated">Оновлення...</td>
      </tr>
    </table>
    <div class="error-msg">Завантаження прогнозу погоди...</div>
  </div>

  <script type="text/javascript">
    var weatherData = null;
    var currentDay = -1;      // -1 = головний екран, 0..6 = деталі дня
    var lastFetchTime = null; // час успішного завантаження (годинник пристрою)
    var fetchFailed = false;  // остання спроба оновлення не вдалася

    (function() {
      // Налаштування енергоспоживання
      var REFRESH_MS = 60 * 60 * 1000;   // планове оновлення: раз на годину
      var RETRY_MS = 5 * 60 * 1000;      // повтор після помилки: через 5 хв
      var TIMEOUT_MS = 20 * 1000;        // таймаут запиту: 20 с

      var apiUrl = "https://api.open-meteo.com/v1/forecast?latitude=49.8397&longitude=24.0297&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,precipitation_probability_max&timezone=Europe%2FKyiv&forecast_days=7";

      var daysFull = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];

      var iconDrop = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M8 1.5C8 1.5 3 7.2 3 10.5a5 5 0 0 0 10 0C13 7.2 8 1.5 8 1.5z"/></svg>';
      var iconUmbrella = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M8 1a7 7 0 0 0-7 7h6v5.5a1.5 1.5 0 0 1-3 0v-.5H2.5v.5a3 3 0 0 0 6 0V8h6a7 7 0 0 0-6.5-7z"/></svg>';
      var iconDrizzle = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 9H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 4.1 2.5 2.5 0 0 1 12.5 9zM4.5 11h1.5v1.5H4.5V11zm3.5 1.5h1.5V14H8v-1.5zm3.5-1.5H13v1.5h-1.5V11z"/></svg>';
      var iconRain = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 9H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 4.1 2.5 2.5 0 0 1 12.5 9zM5.2 10.5l-1.4 3.5h1.6l1.4-3.5H5.2zm4.5 0l-1.4 3.5h1.6l1.4-3.5H9.7z"/></svg>';
      var iconHeavyRain = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 8.5H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 3.6 2.5 2.5 0 0 1 12.5 8.5zM4.2 10l-1.6 4.5h1.5l1.6-4.5H4.2zm3.6 0l-1.6 4.5h1.5l1.6-4.5H7.8zm3.6 0l-1.6 4.5h1.5l1.6-4.5h-1.5z"/></svg>';
      var iconSnow = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M7.2 1h1.6v14H7.2V1zM1 7.2h14v1.6H1V7.2zm2.3-3.8l1.1-1.1 9.3 9.3-1.1 1.1-9.3-9.3zm9.3-1.1l1.1 1.1-9.3 9.3-1.1-1.1 9.3-9.3z"/></svg>';
      var iconHeavySnow = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 8.5H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 3.6 2.5 2.5 0 0 1 12.5 8.5zM4.5 10.2h1.6v1.6H4.5v-1.6zm5.4 0h1.6v1.6H9.9v-1.6zM7.2 12.5h1.6v1.6H7.2v-1.6zM3.5 13.5h1.6v1.6H3.5v-1.6zm7.4 0h1.6v1.6h-1.6v-1.6z"/></svg>';
      var iconStorm = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 8.5H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 3.6 2.5 2.5 0 0 1 12.5 8.5zM8.2 9L5.5 13h2.3l-.8 3 3.8-4.5H8.5L9.2 9H8.2z"/></svg>';

      function getPrecipIcon(code) {
        if (code >= 51 && code <= 57) return iconDrizzle;
        if (code >= 61 && code <= 67) return iconRain;
        if (code >= 71 && code <= 77) return iconSnow;
        if (code >= 80 && code <= 82) return iconHeavyRain;
        if (code >= 85 && code <= 86) return iconHeavySnow;
        if (code >= 95) return iconStorm;
        return iconUmbrella;
      }

      function getWeatherText(code) {
        if (code === 0) return "Ясно";
        if (code === 1) return "Переважно ясно";
        if (code === 2) return "Мінлива хмарність";
        if (code === 3) return "Похмуро";
        if (code === 45 || code === 48) return "Туман";
        if (code >= 51 && code <= 57) return "Мряка";
        if (code >= 61 && code <= 67) return "Дощ";
        if (code >= 71 && code <= 77) return "Сніг";
        if (code >= 80 && code <= 82) return "Злива";
        if (code >= 85 && code <= 86) return "Снігопад";
        if (code >= 95) return "Гроза";
        return "Хмарно";
      }

      function formatTemp(val) {
        if (val === null || val === undefined) return "–";
        var rounded = Math.round(val);
        return (rounded > 0 ? "+" : "") + rounded + "°";
      }

      function pct(val) {
        return (val === null || val === undefined) ? "–" : val + "%";
      }

      function num(val) {
        return (val === null || val === undefined) ? "–" : Math.round(val);
      }

      function padZero(n) {
        return n < 10 ? "0" + n : "" + n;
      }

      // Час завантаження у часовому поясі Києва.
      // Браузер Kindle часто не знає часового поясу й рахує час як UTC,
      // тому беремо абсолютний час пристрою і додаємо зсув, який повертає API
      // (utc_offset_seconds враховує і зимовий, і літній час).
      function fetchTimeStr() {
        if (!lastFetchTime) return "–";
        var offsetSec = (weatherData && weatherData.utc_offset_seconds !== undefined && weatherData.utc_offset_seconds !== null)
          ? weatherData.utc_offset_seconds
          : 7200;
        var kyiv = new Date(lastFetchTime.getTime() + offsetSec * 1000);
        return padZero(kyiv.getUTCHours()) + ":" + padZero(kyiv.getUTCMinutes());
      }

      function parseIsoDate(str) {
        var parts = str.split("T");
        var d = parts[0].split("-");
        var t = parts[1] ? parts[1].split(":") : [0, 0];
        return new Date(
          parseInt(d[0], 10),
          parseInt(d[1], 10) - 1,
          parseInt(d[2], 10),
          parseInt(t[0], 10),
          parseInt(t[1], 10)
        );
      }

      function dayLabelFor(data, dayIndex) {
        var p = data.daily.time[dayIndex].split("-");
        var dateObj = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        var label = (dayIndex === 0) ? "Сьогодні" : (dayIndex === 1 ? "Завтра" : daysFull[dateObj.getDay()]);
        var short = padZero(dateObj.getDate()) + "." + padZero(dateObj.getMonth() + 1);
        return { label: label, short: short };
      }

      function getDailyAvgHumidity(data, dateStr) {
        var sum = 0;
        var count = 0;
        for (var i = 0; i < data.hourly.time.length; i++) {
          var v = data.hourly.relative_humidity_2m[i];
          if (data.hourly.time[i].indexOf(dateStr) === 0 && v !== null && v !== undefined) {
            sum += v;
            count++;
          }
        }
        return count > 0 ? Math.round(sum / count) : null;
      }

      function getCurrentPrecipProb(data, dataNow) {
        var target = data.daily.time[0] + "T" + padZero(dataNow.getHours()) + ":00";
        for (var i = 0; i < data.hourly.time.length; i++) {
          if (data.hourly.time[i] === target) {
            return data.hourly.precipitation_probability[i];
          }
        }
        return data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[0] : null;
      }

      function staleNoteHtml() {
        if (!fetchFailed) return "";
        return '<div class="stale-note">Немає з\'єднання. Показано дані з ' +
          fetchTimeStr() + '. Повтор через 5 хв.</div>';
      }

      window.renderMainView = function() {
        if (!weatherData) return;
        currentDay = -1;
        var data = weatherData;
        var cur = data.current;
        var dataNow = cur.time ? parseIsoDate(cur.time) : new Date();
        var curPrecip = getCurrentPrecipProb(data, dataNow);

        var html = "";
        html += '<table class="header"><tr>';
        html += '<td class="city">Львів</td>';
        html += '<td class="updated">Оновлено: ' + fetchTimeStr() + '</td>';
        html += '</tr></table>';
        html += staleNoteHtml();

        // Поточна погода
        html += '<div class="current-box"><table><tr>';
        html += '<td class="temp-now">' + formatTemp(cur.temperature_2m) + '</td>';
        html += '<td class="details-now">';
        html += '<div class="cond-now">' + getWeatherText(cur.weather_code) + '</div>';
        html += '<table class="sub-details"><tr>';
        html += '<td>Відчувається: <b>' + formatTemp(cur.apparent_temperature) + '</b><br>';
        html += 'Вітер: <b>' + num(cur.wind_speed_10m) + ' км/год</b></td>';
        html += '<td>Вологість: <b>' + pct(cur.relative_humidity_2m) + '</b><br>';
        html += 'Опади: <b>' + pct(curPrecip) + '</b></td>';
        html += '</tr></table>';
        html += '</td></tr></table></div>';

        // Протягом дня: 4 точки з рівним кроком 3 години, починаючи з найближчої майбутньої години
        html += '<div class="section-title">Протягом дня</div>';
        html += '<table class="hourly-table"><tr>';
        var start = -1;
        for (var i = 0; i < data.hourly.time.length; i++) {
          if (parseIsoDate(data.hourly.time[i]).getTime() > dataNow.getTime()) {
            start = i;
            break;
          }
        }
        for (var k = 0; k < 4 && start >= 0; k++) {
          var idx = start + k * 3;
          if (idx >= data.hourly.time.length) break;
          html += '<td>';
          html += '<div class="h-time">' + data.hourly.time[idx].split("T")[1] + '</div>';
          html += '<div class="h-temp">' + formatTemp(data.hourly.temperature_2m[idx]) + '</div>';
          html += '<div class="h-desc">' + getWeatherText(data.hourly.weather_code[idx]) + '</div>';
          html += '</td>';
        }
        html += '</tr></table>';

        // Прогноз на тиждень
        html += '<div class="section-title">Прогноз на тиждень (натисніть для деталей)</div>';
        html += '<table class="daily-table">';
        for (var d = 0; d < data.daily.time.length; d++) {
          var lbl = dayLabelFor(data, d);
          var avgHum = getDailyAvgHumidity(data, data.daily.time[d]);
          var popMax = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[d] : null;
          var wCode = data.daily.weather_code[d];

          html += '<tr onclick="renderDayView(' + d + ')">';
          html += '<td class="d-day">' + lbl.label + ' <span style="font-weight:normal;font-size:15px;">(' + lbl.short + ')</span></td>';
          html += '<td class="d-desc">' + getWeatherText(wCode) + '</td>';
          html += '<td class="d-pop">' + getPrecipIcon(wCode) + '<b>' + pct(popMax) + '</b></td>';
          html += '<td class="d-hum">' + iconDrop + pct(avgHum) + '</td>';
          html += '<td class="d-temp">' + formatTemp(data.daily.temperature_2m_min[d]) + '..' + formatTemp(data.daily.temperature_2m_max[d]) + '<span class="arrow-hint">&rsaquo;</span></td>';
          html += '</tr>';
        }
        html += '</table>';

        document.getElementById("app").innerHTML = html;
      };

      window.renderDayView = function(dayIndex) {
        if (!weatherData) return;
        var data = weatherData;
        if (dayIndex < 0 || dayIndex >= data.daily.time.length) {
          renderMainView();
          return;
        }
        currentDay = dayIndex;
        var dateStr = data.daily.time[dayIndex];
        var lbl = dayLabelFor(data, dayIndex);

        var html = "";
        html += '<table class="header"><tr>';
        html += '<td><a class="back-btn" href="#" onclick="renderMainView(); return false;">&larr; НАЗАД</a></td>';
        html += '<td class="updated" style="font-size:20px;font-weight:bold;">' + lbl.label + ', ' + lbl.short + '</td>';
        html += '</tr></table>';
        html += staleNoteHtml();

        var precipProb = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[dayIndex] : null;
        var avgHum = getDailyAvgHumidity(data, dateStr);

        html += '<div class="current-box"><table><tr>';
        html += '<td class="temp-now" style="font-size:46px;width:38%;">' + formatTemp(data.daily.temperature_2m_min[dayIndex]) + '..' + formatTemp(data.daily.temperature_2m_max[dayIndex]) + '</td>';
        html += '<td class="details-now" style="width:62%;">';
        html += '<div class="cond-now">' + getWeatherText(data.daily.weather_code[dayIndex]) + '</div>';
        html += '<table class="sub-details"><tr>';
        html += '<td>Вітер: <b>до ' + num(data.daily.wind_speed_10m_max[dayIndex]) + ' км/год</b><br>Опади: <b>' + pct(precipProb) + '</b></td>';
        html += '<td>Вологість: <b>' + pct(avgHum) + '</b></td>';
        html += '</tr></table>';
        html += '</td></tr></table></div>';

        html += '<div class="section-title">Детально по годинах</div>';
        html += '<table class="daily-table">';
        var detailHours = ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "21:00"];
        for (var j = 0; j < data.hourly.time.length; j++) {
          var hItem = data.hourly.time[j];
          if (hItem.indexOf(dateStr) === 0) {
            var hOnly = hItem.split("T")[1];
            if (detailHours.indexOf(hOnly) !== -1) {
              var hCode = data.hourly.weather_code[j];
              html += '<tr>';
              html += '<td class="d-day" style="padding:7px 3px;width:19%;">' + hOnly + '</td>';
              html += '<td class="d-desc" style="padding:7px 3px;width:36%;">' + getWeatherText(hCode) + '</td>';
              html += '<td class="d-pop" style="padding:7px 3px;width:14%;">' + getPrecipIcon(hCode) + '<b>' + pct(data.hourly.precipitation_probability[j]) + '</b></td>';
              html += '<td class="d-hum" style="padding:7px 3px;width:14%;">' + iconDrop + pct(data.hourly.relative_humidity_2m[j]) + '</td>';
              html += '<td class="d-temp" style="padding:7px 3px;width:17%;">' + formatTemp(data.hourly.temperature_2m[j]) + '</td>';
              html += '</tr>';
            }
          }
        }
        html += '</table>';

        document.getElementById("app").innerHTML = html;
      };

      // Перемальовує той екран, який зараз відкритий (головний або деталі дня)
      function renderCurrentView() {
        if (currentDay >= 0) {
          renderDayView(currentDay);
        } else {
          renderMainView();
        }
      }

      function showFatalError(msg) {
        document.getElementById("app").innerHTML =
          '<table class="header"><tr><td class="city">Львів</td><td class="updated"></td></tr></table>' +
          '<div class="error-msg">' + msg + '<br><br>Повтор через 5 хв.</div>';
      }

      function onFetchError(msg) {
        fetchFailed = true;
        if (weatherData) {
          // Залишаємо старі дані на екрані, лише додаємо попередження
          renderCurrentView();
        } else {
          showFatalError(msg);
        }
        setTimeout(fetchWeather, RETRY_MS);
      }

      function fetchWeather() {
        var xhr = new XMLHttpRequest();
        var finished = false;

        // Ручний таймаут: старий браузер Kindle може не підтримувати xhr.timeout
        var timer = setTimeout(function() {
          if (finished) return;
          finished = true;
          try { xhr.abort(); } catch (e) {}
          onFetchError("Сервер не відповідає. Перевірте Wi-Fi.");
        }, TIMEOUT_MS);

        xhr.open("GET", apiUrl, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState !== 4 || finished) return;
          finished = true;
          clearTimeout(timer);

          if (xhr.status === 200) {
            try {
              weatherData = JSON.parse(xhr.responseText);
              lastFetchTime = new Date();
              fetchFailed = false;
              renderCurrentView();
              setTimeout(fetchWeather, REFRESH_MS);
            } catch (e) {
              onFetchError("Помилка обробки даних погоди.");
            }
          } else {
            onFetchError("Не вдалося завантажити дані (код: " + xhr.status + "). Перевірте Wi-Fi.");
          }
        };
        xhr.send();
      }

      fetchWeather();
    })();
  </script>
</body>
</html>
