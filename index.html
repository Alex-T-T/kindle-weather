<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="900">
  <title>Погода Львів — Kindle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      width: 580px;
      margin: 0 auto;
      padding: 10px 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    .header {
      border-bottom: 3px solid #000000;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .city {
      font-size: 26px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .updated {
      font-size: 16px;
      text-align: right;
      vertical-align: bottom;
    }
    .current-box {
      border: 3px solid #000000;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .temp-now {
      font-size: 68px;
      font-weight: bold;
      line-height: 1;
      width: 48%;
    }
    .details-now {
      font-size: 18px;
      line-height: 1.3;
      vertical-align: middle;
      width: 52%;
    }
    .cond-now {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .section-title {
      font-size: 17px;
      font-weight: bold;
      text-transform: uppercase;
      background-color: #000000;
      color: #ffffff;
      padding: 5px 10px;
      margin-bottom: 6px;
    }
    .hourly-table {
      margin-bottom: 10px;
      border: 2px solid #000000;
    }
    .hourly-table td {
      width: 25%;
      text-align: center;
      padding: 6px 4px;
      border-right: 2px solid #000000;
    }
    .hourly-table td:last-child {
      border-right: none;
    }
    .h-time {
      font-size: 17px;
      font-weight: bold;
    }
    .h-temp {
      font-size: 25px;
      font-weight: bold;
      margin: 2px 0;
    }
    .h-desc {
      font-size: 14px;
    }
    .daily-table td {
      padding: 10px 3px;
      border-bottom: 2px solid #000000;
      font-size: 19px;
      cursor: pointer;
    }
    .daily-table tr:last-child td {
      border-bottom: none;
    }
    .d-day {
      font-weight: bold;
      width: 33%;
      text-align: left;
    }
    .d-desc {
      width: 20%;
      font-size: 16px;
      text-align: left;
    }
    .d-pop {
      width: 13%;
      font-size: 15px;
      text-align: left;
      white-space: nowrap;
    }
    .d-hum {
      width: 12%;
      font-size: 15px;
      text-align: left;
      white-space: nowrap;
    }
    .d-temp {
      text-align: right;
      font-weight: bold;
      width: 22%;
      white-space: nowrap;
    }
    .icon-svg {
      width: 14px;
      height: 14px;
      vertical-align: -2px;
      margin-right: 2px;
    }
    .arrow-hint {
      font-weight: normal;
      font-size: 18px;
      padding-left: 3px;
    }
    .back-btn {
      display: inline-block;
      background-color: #000000;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 8px 16px;
      text-decoration: none;
      cursor: pointer;
      border: 2px solid #000000;
    }
    .error-msg {
      font-size: 20px;
      font-weight: bold;
      padding: 20px;
      border: 2px solid #000000;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="app">
    <table class="header">
      <tr>
        <td class="city">Львів</td>
        <td class="updated">Оновлення...</td>
      </tr>
    </table>
    <div class="error-msg">Завантаження прогнозу погоди...</div>
  </div>

  <script type="text/javascript">
    var weatherData = null;

    (function() {
      var apiUrl = "https://api.open-meteo.com/v1/forecast?latitude=49.8397&longitude=24.0297&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,precipitation_probability_max&timezone=Europe%2FKyiv&forecast_days=7";

      var daysFull = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];

      var iconDrop = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M8 1.5C8 1.5 3 7.2 3 10.5a5 5 0 0 0 10 0C13 7.2 8 1.5 8 1.5z"/></svg>';
      var iconUmbrella = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M8 1a7 7 0 0 0-7 7h6v5.5a1.5 1.5 0 0 1-3 0v-.5H2.5v.5a3 3 0 0 0 6 0V8h6a7 7 0 0 0-6.5-7z"/></svg>';
      var iconDrizzle = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 9H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 4.1 2.5 2.5 0 0 1 12.5 9zM4.5 11h1.5v1.5H4.5V11zm3.5 1.5h1.5V14H8v-1.5zm3.5-1.5H13v1.5h-1.5V11z"/></svg>';
      var iconRain = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 9H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 4.1 2.5 2.5 0 0 1 12.5 9zM5.2 10.5l-1.4 3.5h1.6l1.4-3.5H5.2zm4.5 0l-1.4 3.5h1.6l1.4-3.5H9.7z"/></svg>';
      var iconHeavyRain = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 8.5H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 3.6 2.5 2.5 0 0 1 12.5 8.5zM4.2 10l-1.6 4.5h1.5l1.6-4.5H4.2zm3.6 0l-1.6 4.5h1.5l1.6-4.5H7.8zm3.6 0l-1.6 4.5h1.5l1.6-4.5h-1.5z"/></svg>';
      var iconSnow = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M7.2 1h1.6v14H7.2V1zM1 7.2h14v1.6H1V7.2zm2.3-3.8l1.1-1.1 9.3 9.3-1.1 1.1-9.3-9.3zm9.3-1.1l1.1 1.1-9.3 9.3-1.1-1.1 9.3-9.3z"/></svg>';
      var iconHeavySnow = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 8.5H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 3.6 2.5 2.5 0 0 1 12.5 8.5zM4.5 10.2h1.6v1.6H4.5v-1.6zm5.4 0h1.6v1.6H9.9v-1.6zM7.2 12.5h1.6v1.6H7.2v-1.6zM3.5 13.5h1.6v1.6H3.5v-1.6zm7.4 0h1.6v1.6h-1.6v-1.6z"/></svg>';
      var iconStorm = '<svg class="icon-svg" viewBox="0 0 16 16"><path fill="#000" d="M12.5 8.5H4a3 3 0 0 1-.4-5.97A4.5 4.5 0 0 1 12.2 3.6 2.5 2.5 0 0 1 12.5 8.5zM8.2 9L5.5 13h2.3l-.8 3 3.8-4.5H8.5L9.2 9H8.2z"/></svg>';

      function getPrecipIcon(code) {
        if (code >= 51 && code <= 57) return iconDrizzle;
        if (code >= 61 && code <= 67) return iconRain;
        if (code >= 71 && code <= 77) return iconSnow;
        if (code >= 80 && code <= 82) return iconHeavyRain;
        if (code >= 85 && code <= 86) return iconHeavySnow;
        if (code >= 95) return iconStorm;
        return iconUmbrella;
      }

      function getWeatherText(code) {
        if (code === 0) return "Ясно";
        if (code === 1) return "Переважно ясно";
        if (code === 2) return "Мінлива хмарність";
        if (code === 3) return "Похмуро";
        if (code === 45 || code === 48) return "Туман";
        if (code >= 51 && code <= 57) return "Мряка";
        if (code >= 61 && code <= 67) return "Дощ";
        if (code >= 71 && code <= 77) return "Сніг";
        if (code >= 80 && code <= 82) return "Злива";
        if (code >= 85 && code <= 86) return "Снігопад";
        if (code >= 95) return "Гроза";
        return "Хмарно";
      }

      function formatTemp(val) {
        var rounded = Math.round(val);
        return (rounded > 0 ? "+" : "") + rounded + "°";
      }

      function padZero(num) {
        return num < 10 ? "0" + num : "" + num;
      }

      function parseIsoDate(str) {
        var parts = str.split("T");
        var d = parts[0].split("-");
        var t = parts[1] ? parts[1].split(":") : [0, 0];
        return new Date(
          parseInt(d[0], 10),
          parseInt(d[1], 10) - 1,
          parseInt(d[2], 10),
          parseInt(t[0], 10),
          parseInt(t[1], 10)
        );
      }

      function getDailyAvgHumidity(data, dateStr) {
        var sum = 0;
        var count = 0;
        for (var i = 0; i < data.hourly.time.length; i++) {
          if (data.hourly.time[i].indexOf(dateStr) === 0) {
            sum += data.hourly.relative_humidity_2m[i];
            count++;
          }
        }
        return count > 0 ? Math.round(sum / count) : 0;
      }

      function getCurrentPrecipProb(data, kyivNow) {
        var targetPrefix = data.daily.time[0] + "T" + padZero(kyivNow.getHours()) + ":00";
        for (var i = 0; i < data.hourly.time.length; i++) {
          if (data.hourly.time[i] === targetPrefix) {
            return data.hourly.precipitation_probability[i];
          }
        }
        return data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[0] : 0;
      }

      window.renderMainView = function() {
        if (!weatherData) return;
        var data = weatherData;
        var cur = data.current;
        var kyivNow = cur.time ? parseIsoDate(cur.time) : new Date();
        var curPrecip = getCurrentPrecipProb(data, kyivNow);

        var html = "";
        html += '<table class="header"><tr>';
        html += '<td class="city">Львів</td>';
        html += '<td class="updated">Оновлено: ' + padZero(kyivNow.getHours()) + ':' + padZero(kyivNow.getMinutes()) + '</td>';
        html += '</tr></table>';

        html += '<div class="current-box"><table><tr>';
        html += '<td class="temp-now">' + formatTemp(cur.temperature_2m) + '</td>';
        html += '<td class="details-now">';
        html += '<div class="cond-now">' + getWeatherText(cur.weather_code) + '</div>';
        html += 'Відчувається: <b>' + formatTemp(cur.apparent_temperature) + '</b><br>';
        html += 'Вітер: <b>' + Math.round(cur.wind_speed_10m) + ' км/год</b><br>';
        html += 'Вологість: <b>' + cur.relative_humidity_2m + '%</b><br>';
        html += 'Опади: <b>' + curPrecip + '%</b>';
        html += '</td></tr></table></div>';

        html += '<div class="section-title">Протягом дня</div>';
        html += '<table class="hourly-table"><tr>';
        var currentHour = kyivNow.getHours();
        var shownHours = 0;
        for (var i = 0; i < data.hourly.time.length; i++) {
          var itemDate = parseIsoDate(data.hourly.time[i]);
          if (itemDate.getTime() > kyivNow.getTime() && shownHours < 4) {
            if ((itemDate.getHours() - currentHour + 24) % 3 === 0 || shownHours === 0) {
              var hStr = padZero(itemDate.getHours()) + ":00";
              html += '<td>';
              html += '<div class="h-time">' + hStr + '</div>';
              html += '<div class="h-temp">' + formatTemp(data.hourly.temperature_2m[i]) + '</div>';
              html += '<div class="h-desc">' + getWeatherText(data.hourly.weather_code[i]) + '</div>';
              html += '</td>';
              shownHours++;
            }
          }
        }
        html += '</tr></table>';

        html += '<div class="section-title">Прогноз на тиждень (натисніть для деталей)</div>';
        html += '<table class="daily-table">';
        for (var d = 0; d < data.daily.time.length; d++) {
          var dateStr = data.daily.time[d];
          var parts = dateStr.split("-");
          var dateObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          var dayLabel = (d === 0) ? "Сьогодні" : (d === 1 ? "Завтра" : daysFull[dateObj.getDay()]);
          var dateShort = padZero(dateObj.getDate()) + "." + padZero(dateObj.getMonth() + 1);
          var avgHum = getDailyAvgHumidity(data, dateStr);
          var popMax = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[d] : 0;
          var wCode = data.daily.weather_code[d];
          var precipIcon = getPrecipIcon(wCode);

          html += '<tr onclick="renderDayView(' + d + ')">';
          html += '<td class="d-day">' + dayLabel + ' <span style="font-weight:normal;font-size:15px;">(' + dateShort + ')</span></td>';
          html += '<td class="d-desc">' + getWeatherText(wCode) + '</td>';
          html += '<td class="d-pop">' + precipIcon + '<b>' + popMax + '%</b></td>';
          html += '<td class="d-hum">' + iconDrop + avgHum + '%</td>';
          html += '<td class="d-temp">' + formatTemp(data.daily.temperature_2m_min[d]) + '..' + formatTemp(data.daily.temperature_2m_max[d]) + '<span class="arrow-hint">&rsaquo;</span></td>';
          html += '</tr>';
        }
        html += '</table>';

        document.getElementById("app").innerHTML = html;
      };

      window.renderDayView = function(dayIndex) {
        if (!weatherData) return;
        var data = weatherData;
        var dateStr = data.daily.time[dayIndex];
        var parts = dateStr.split("-");
        var dateObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        var dayLabel = (dayIndex === 0) ? "Сьогодні" : (dayIndex === 1 ? "Завтра" : daysFull[dateObj.getDay()]);
        var dateShort = padZero(dateObj.getDate()) + "." + padZero(dateObj.getMonth() + 1);

        var html = "";
        html += '<table class="header"><tr>';
        html += '<td><span class="back-btn" onclick="renderMainView()">&larr; НАЗАД</span></td>';
        html += '<td class="updated" style="font-size:20px;font-weight:bold;">' + dayLabel + ', ' + dateShort + '</td>';
        html += '</tr></table>';

        var minT = formatTemp(data.daily.temperature_2m_min[dayIndex]);
        var maxT = formatTemp(data.daily.temperature_2m_max[dayIndex]);
        var maxWind = Math.round(data.daily.wind_speed_10m_max[dayIndex]);
        var precipProb = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[dayIndex] : 0;
        var avgHum = getDailyAvgHumidity(data, dateStr);

        html += '<div class="current-box"><table><tr>';
        html += '<td class="temp-now" style="font-size:50px;">' + minT + ' .. ' + maxT + '</td>';
        html += '<td class="details-now">';
        html += '<div class="cond-now">' + getWeatherText(data.daily.weather_code[dayIndex]) + '</div>';
        html += 'Макс. вітер: <b>' + maxWind + ' км/год</b><br>';
        html += 'Вологість (сер.): <b>' + avgHum + '%</b><br>';
        html += 'Ймовірність опадів: <b>' + precipProb + '%</b>';
        html += '</td></tr></table></div>';

        html += '<div class="section-title">Погода протягом обраного дня</div>';
        html += '<table class="hourly-table"><tr>';
        var targetHours = ["06:00", "12:00", "18:00", "21:00"];
        for (var i = 0; i < data.hourly.time.length; i++) {
          var hFull = data.hourly.time[i];
          if (hFull.indexOf(dateStr) === 0) {
            var hourPart = hFull.split("T")[1];
            if (targetHours.indexOf(hourPart) !== -1) {
              html += '<td>';
              html += '<div class="h-time">' + hourPart + '</div>';
              html += '<div class="h-temp">' + formatTemp(data.hourly.temperature_2m[i]) + '</div>';
              html += '<div class="h-desc">' + getWeatherText(data.hourly.weather_code[i]) + '</div>';
              html += '</td>';
            }
          }
        }
        html += '</tr></table>';

        html += '<div class="section-title">Детально по годинах</div>';
        html += '<table class="daily-table">';
        var detailHours = ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "21:00"];
        for (var j = 0; j < data.hourly.time.length; j++) {
          var hItem = data.hourly.time[j];
          if (hItem.indexOf(dateStr) === 0) {
            var hOnly = hItem.split("T")[1];
            if (detailHours.indexOf(hOnly) !== -1) {
              var hHum = data.hourly.relative_humidity_2m[j];
              var hPop = data.hourly.precipitation_probability[j];
              var hCode = data.hourly.weather_code[j];
              var hPrecipIcon = getPrecipIcon(hCode);

              html += '<tr>';
              html += '<td class="d-day" style="padding:6px 3px;width:19%;">' + hOnly + '</td>';
              html += '<td class="d-desc" style="padding:6px 3px;width:36%;">' + getWeatherText(hCode) + '</td>';
              html += '<td class="d-pop" style="padding:6px 3px;width:14%;">' + hPrecipIcon + '<b>' + hPop + '%</b></td>';
              html += '<td class="d-hum" style="padding:6px 3px;width:14%;">' + iconDrop + hHum + '%</td>';
              html += '<td class="d-temp" style="padding:6px 3px;width:17%;">' + formatTemp(data.hourly.temperature_2m[j]) + '</td>';
              html += '</tr>';
            }
          }
        }
        html += '</table>';

        document.getElementById("app").innerHTML = html;
      };

      function fetchWeather() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", apiUrl, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              try {
                weatherData = JSON.parse(xhr.responseText);
                renderMainView();
              } catch (e) {
                document.getElementById("app").innerHTML =
                  '<div class="error-msg">Помилка обробки даних погоди.</div>';
              }
            } else {
              document.getElementById("app").innerHTML =
                '<div class="error-msg">Не вдалося завантажити дані (код: ' + xhr.status + '). Перевірте Wi-Fi.</div>';
            }
          }
        };
        xhr.send();
      }

      fetchWeather();
    })();
  </script>
</body>
</html>
